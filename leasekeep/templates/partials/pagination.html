{% if page.has_other_pages %}
<nav class="actions" style="margin-top:14px" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn--sm" href="?{% if q %}q={{ q|urlencode }}&{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span class="muted small" style="align-self:center">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--sm" href="?{% if q %}q={{ q|urlencode }}&{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
