{% extends "portal_base.html" %}
{% load leasekeep %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'portal:home' %}">{% icon "back" "sm" %} My home</a></div><h1>{{ title }}</h1>{% if intro %}<p style="max-width:70ch">{{ intro }}</p>{% endif %}</div></div>
<section class="card" style="max-width:820px">
  <form method="post" class="form form--wide" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" with grid=True %}
    <div class="form-actions"><button class="btn btn--primary" type="submit">Submit</button><a class="btn btn--ghost" href="{% url 'portal:home' %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
