[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leasekeep"
dynamic = ["version"]
description = "Stewardship software for community land trusts: ground leases, lease fees, occupancy checks, improvement credits, refinance approvals and resale formula prices."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Joel Stain Lobo" }]
keywords = ["community land trust", "affordable housing", "ground lease", "resale formula", "django"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Other Audience",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "Django>=5.2,<6.0",
  "dj-database-url>=2.3",
  "psycopg[binary]>=3.2",
  "stripe>=12",
  "whitenoise>=6.8",
  "gunicorn>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "pytest-cov>=6", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/lobojoel2003/Leasekeep"
Source = "https://github.com/lobojoel2003/Leasekeep"
Issues = "https://github.com/lobojoel2003/Leasekeep/issues"
Changelog = "https://github.com/lobojoel2003/Leasekeep/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "leasekeep.__version__" }

[tool.setuptools.packages.find]
include = ["leasekeep*"]

[tool.setuptools.package-data]
leasekeep = ["templates/**/*", "static/**/*", "build_info.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning", "error::django.utils.deprecation.RemovedInDjango60Warning"]

[tool.coverage.run]
source = ["leasekeep"]
branch = true
omit = ["leasekeep/*/migrations/*", "leasekeep/asgi.py", "leasekeep/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["leasekeep/*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "C4", "SIM", "RUF", "S", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "S101", "DJ001", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["leasekeep"]
