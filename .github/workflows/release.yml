name: Release

# Push a tag like v1.2.3 (matching leasekeep.__version__ and a CHANGELOG.md
# section) to publish: tests run, then the wheel/sdist, a multi-architecture
# image on GHCR and a GitHub Release with notes from the changelog.
# "Run workflow" re-releases or creates the tag from the selected commit.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0 (created on the selected commit if it doesn't exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/leasekeep

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leasekeep
          POSTGRES_USER: leasekeep
          POSTGRES_PASSWORD: leasekeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leasekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the commit to release
        id: commit
        # An existing tag always releases the commit it points to, so re-running a
        # release rebuilds exactly that code. A new tag is created on the selected commit.
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          else
            sha="$GITHUB_SHA"
          fi
          git checkout -q "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha::7}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from commit $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Tag matches version and changelog
        id: meta
        run: |
          python scripts/release_tools.py check-tag "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest
        env:
          DATABASE_URL: postgres://leasekeep:leasekeep@localhost:5432/leasekeep

  package:
    name: Build wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build
          python scripts/write_build_info.py --build-number "${{ github.run_number }}" --git-sha "${{ needs.verify.outputs.sha }}"
          python -m build
          # Dotfiles are skipped by shell globs, so ship the example settings without the dot.
          cp docker-compose.yml dist/
          cp .env.example dist/env.example
          cd dist && sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=sha-${{ needs.verify.outputs.short_sha }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [verify, package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Release notes
        run: |
          {
            # Drop the changelog's link-reference definitions from the notes.
            python scripts/release_tools.py notes "$TAG" | grep -vE '^\[[^]]+\]: https?://'
            echo
            echo "---"
            echo
            echo "**Build** ${{ github.run_number }} · commit \`${{ needs.verify.outputs.short_sha }}\`"
            echo
            echo "**Container image**"
            echo '```bash'
            echo "docker pull $IMAGE:${TAG#v}"
            echo '```'
            echo "Digest: \`${{ needs.image.outputs.digest }}\`"
            echo
            echo "**Self-host**: download \`docker-compose.yml\` and \`env.example\` below, save \`env.example\` as \`.env\` and fill it in, then follow the README's self-hosting guide. \`SHA256SUMS\` lists checksums for every file."
          } > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Leasekeep $TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Leasekeep $TAG" --notes-file notes.md \
              --target "${{ needs.verify.outputs.sha }}" "${flags[@]}"
          fi

  deploy:
    name: Deploy
    needs: [github-release, verify]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the deploy hook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret is set, so nothing to deploy. Add one (Render, Railway, Coolify, Portainer…) to deploy each release automatically." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" --data-urlencode "tag=${TAG}" --data-urlencode "image=${IMAGE}:${TAG#v}"
          echo "Deploy triggered for ${IMAGE}:${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
